[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Data and geometry must 404 when they are missing, not fall through to the SPA
# fallback below. These rules come first because Netlify takes the first match,
# and neither is `force`d, so an existing file still wins over the rule and is
# served normally — this only catches paths with nothing behind them.
#
# Without them a data file left out of a deploy returns `index.html` with a 200,
# `res.json()` fails on the markup, and the dashboard reports the most likely
# production failure it has as "Unexpected token '<'". See useFetchJSON.
[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 404

[[redirects]]
  from = "/geo/*"
  to = "/geo/:splat"
  status = 404

# SPA fallback — every route is client-rendered.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite content-hashes every file it emits into /assets — all 26 of them, JS and
# CSS alike — so a changed file is a changed filename and a cached copy can
# never be stale. Netlify's default for static files is
# `max-age=0, must-revalidate`, which spends a round trip per asset per visit
# revalidating bytes that are immutable by construction. `immutable` is the
# whole point of the hashing and was the one caching rule this file was missing.
#
# Scoped to /assets/* deliberately: index.html is NOT hashed and must stay
# revalidated, or a deploy would never reach browsers that already have it.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Data is regenerated by an explicit ETL run, not per-request.
#
# `stale-while-revalidate` is the part that matters on a slow connection. Under
# plain `max-age=3600` the hour expires and the next visit *blocks* on
# re-downloading files that are almost always byte-identical — 253 kB gzipped
# for the explorer cube, 255 kB for the facility summary. With SWR the browser
# serves the cached copy immediately and refreshes it in the background, so a
# reader on a weak link never waits for a payload they already have.
#
# The complete fix is content-hashed data filenames, the way Vite already hashes
# the JS, which would allow `immutable` and remove revalidation entirely. That
# needs the ETL to emit hashed names and the app to resolve them through a
# manifest — a real change, not a header, and not one this phase needs.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"

# Administrative boundaries are not part of the ETL output at all — they come
# from `scripts/convert-lga-boundaries.mjs` and change only when a boundary
# source is replaced. They had no cache policy, so they were revalidated far
# more often than anything about them warrants.
#
# The explicit Content-Type is deliberate: `vite preview` serves `.geojson`
# unrecognised and therefore uncompressed, and these two files are 2.04 MB and
# 1.84 MB raw against 877 kB and 623 kB gzipped. Declaring them as JSON puts
# them on any host's compression allowlist. Worth confirming against the real
# deploy's response headers, on whichever host this ends up on.
[[headers]]
  for = "/geo/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
    Content-Type = "application/json; charset=utf-8"
